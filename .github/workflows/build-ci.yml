name: build-ci

on:
  pull_request:
    paths:
      - "**/Dockerfile"
      - "**/entrypoint*"
      - "**/PLATFORMS"
      - "tests/**"
      - "tools/genmatrix.js"
      - ".github/workflows/build-ci.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  gen-matrix:
    name: generate-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate testing matrix
        uses: actions/github-script@v7
        id: generator
        with:
          script: |
            // Read changed files from the API rather than a third-party
            // action, so the build list depends on nothing we don't control.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const script = require(`${process.env.GITHUB_WORKSPACE}/tools/genmatrix.js`);
            return script(process.env.GITHUB_WORKSPACE, files.map(file => file.filename));
    outputs:
      matrix: ${{ steps.generator.outputs.result }}

  build:
    if: ${{ needs.gen-matrix.outputs.matrix != 'null' }}
    needs: gen-matrix
    name: build
    env:
      image_tag: local/ci:${{ github.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.gen-matrix.outputs.matrix) }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          push: false
          load: true
          tags: ${{ env.image_tag }}
          platforms: ${{ matrix.platform }}
          context: ./${{ matrix.version }}/${{ matrix.variant }}
          file: ./${{ matrix.version }}/${{ matrix.variant }}/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run integration tests
        run: |
          python3 -m tests.integration_runner \
                  --platform ${{ matrix.platform }} \
                  --image ${{ env.image_tag }} \
                  --version ${{ matrix.version }}
